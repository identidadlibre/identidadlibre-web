# Dependabot: mantiene al día las acciones de GitHub fijadas por hash
# (actualiza el SHA y el comentario de versión en cada uses:).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      acciones-github:
        patterns: ["*"]
